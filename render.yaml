services:
  - type: web
    name: tribe-culture
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: tribe-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: TC_DATA_DIR
        value: /data
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORE_EMAIL
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALLOW_PREVIEW_CHECKOUT
        value: "true"
      - key: NODE_ENV
        value: production
