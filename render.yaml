services:
  - type: web
    name: tribe-culture
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 20
    autoDeploy: true
    # the store is a single JSON file on one disk: never run two instances
    numInstances: 1
    # preview environments would boot without the disk and with an empty store
    previews:
      generation: "off"
    disk:
      name: tribe-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: TC_DATA_DIR
        value: /data
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORE_EMAIL
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # keep this false in production: preview mode marks orders paid without
      # taking money, and is only meant for rehearsing the flow locally
      - key: ALLOW_PREVIEW_CHECKOUT
        value: "false"
      - key: LOW_STOCK_AT
        value: "3"
      # optional. Signs receipt links. Leave blank and the server generates one
      # on the disk at first boot, so links survive password changes either way.
      - key: INVOICE_SECRET
        sync: false
      - key: NODE_ENV
        value: production
