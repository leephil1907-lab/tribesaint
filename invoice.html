<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice — Tribe Culture</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050505">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/css/fonts.css">
<style>
  :root{
    --ink:#050505; --bone:#ece3cf; --parch:#d9cdb2; --red:#d4141b; --ox:#7a0f14;
    --paper:#fffdf8; --paper-2:#f6f2e9; --rule:#e2dbcb; --mute:#6f6a60;
    --sans:Oswald,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#0a0908;color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;
       padding:clamp(12px,3vw,34px)}
  a{color:inherit}
  .sheet{width:100%;max-width:920px;margin:0 auto;background:var(--paper);box-shadow:0 40px 120px rgba(0,0,0,.6)}
  .bar{max-width:920px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .bar .btns{display:none;gap:8px;flex-wrap:wrap}
  .bar.ready-with-doc .btns{display:flex}
  .btn{font:500 9px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:12px 16px;border:1px solid rgba(236,227,207,.3);
       background:transparent;color:var(--bone);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .btn:hover{background:var(--bone);color:#000;border-color:var(--bone)}
  .btn.red{background:var(--red);border-color:var(--red);color:#fff}
  .btn.red:hover{background:var(--ox);border-color:var(--ox);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .back{font:400 9px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#8b8478;text-decoration:none}
  .back:hover{color:var(--bone)}

  /* ---------- document ---------- */
  .doc{background:var(--paper);color:var(--ink)}
  .head{background:#0d0d0d;color:var(--bone);padding:26px clamp(18px,4vw,40px);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-start}
  @media(max-width:560px){.head .right{text-align:left;width:100%}.head .rule{margin:12px 0 0}}
  .head .brand{display:flex;gap:14px;align-items:center}
  .head .brand img{width:46px;height:auto;display:block}
  .head .name{font:400 22px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--bone)}
  .head .est{font:300 8px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:#8b8478;margin-top:8px}
  .head .contact{font:300 10px/1.7 var(--sans);color:#b6ae9f;margin-top:8px;letter-spacing:.04em}
  .head .right{text-align:right}
  .head .kind{font:400 clamp(22px,4vw,30px)/1 var(--sans);letter-spacing:.18em;text-transform:uppercase}
  .head .no{font:500 11px/1 var(--sans);letter-spacing:.14em;color:var(--red);margin-top:9px}
  .head .state{font:300 8px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:#8b8478;margin-top:9px}
  .head .rule{width:120px;height:2px;background:var(--red);margin:12px 0 0 auto}

  .body{padding:clamp(20px,4vw,40px)}
  .meta{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(16px,3vw,40px)}
  @media(max-width:680px){.meta{grid-template-columns:1fr}}
  .lbl{font:500 8px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--red)}
  .who{font:400 15px/1.4 var(--sans);margin:12px 0 4px;letter-spacing:.02em}
  .addr{font:300 12px/1.7 var(--sans);color:#4a4640}
  .rows{margin-top:10px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font:300 11.5px/1.4 var(--sans)}
  .row span:first-child{color:var(--mute);letter-spacing:.16em;text-transform:uppercase;font-size:9px}
  .row span:last-child{text-align:right;color:#1a1714}

  table.items{width:100%;border-collapse:collapse;margin-top:clamp(18px,3vw,32px)}
  table.items thead th{background:var(--paper-2);font:500 8px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:#1a1714;
       padding:11px 10px;text-align:left;border-bottom:1px solid var(--rule)}
  table.items thead th.r{text-align:right}
  table.items tbody td{padding:12px 10px;border-bottom:1px solid var(--rule);vertical-align:middle;font:300 12px/1.45 var(--sans)}
  .piece{display:flex;gap:10px;align-items:center}
  .piece img{width:44px;height:44px;object-fit:cover;border:1px solid var(--rule);flex:none}
  .piece .nm{font:500 12.5px/1.3 var(--sans);letter-spacing:.02em;color:#12100e}
  .piece .vr{font:300 9.5px/1.4 var(--sans);color:var(--mute);letter-spacing:.06em;margin-top:2px}
  .num{text-align:right;white-space:nowrap}
  .amt{font:500 12.5px/1.4 var(--sans);text-align:right;white-space:nowrap}
  tbody tr:nth-child(even){background:#fcfaf4}

  .foot{display:grid;grid-template-columns:1fr auto;gap:clamp(16px,3vw,34px);margin-top:8px;align-items:start}
  @media(max-width:680px){.foot{grid-template-columns:1fr}}
  .totals{min-width:min(100%,300px);margin-left:auto;padding-top:14px}
  .trow{display:flex;justify-content:space-between;gap:20px;padding:5px 0;font:300 12px/1.5 var(--sans);color:#4a4640}
  .trow.big{border-top:1px solid #0d0d0d;margin-top:8px;padding-top:11px;font:500 13px/1.4 var(--sans);color:#0d0d0d;letter-spacing:.1em;text-transform:uppercase}
  .trow.big b{font:400 19px/1 var(--sans);color:var(--red);letter-spacing:.02em;text-transform:none}
  .pay{margin-top:18px;border:1px solid var(--rule);background:#fbfaf5;padding:14px 16px;display:grid;gap:4px}
  .pay .t{font:500 8px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:#1c6b34}
  .pay.pending .t{color:var(--red)}
  .pay p{margin:4px 0 0;font:300 11.5px/1.6 var(--sans);color:#4a4640}
  .notes{margin-top:clamp(18px,3vw,28px);display:grid;gap:14px}
  .notes h3{font:500 8px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--red);margin:0 0 6px}
  .notes p{margin:0;font:300 11px/1.75 var(--sans);color:#514c45}

  .docfoot{border-top:2px solid #0d0d0d;margin-top:clamp(22px,4vw,36px);padding-top:14px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .docfoot .b{font:500 10px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#0d0d0d}
  .docfoot .s{font:300 9.5px/1.7 var(--sans);color:var(--mute);margin-top:7px}
  .stamp{font:300 8.5px/1.5 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-top:8px}
  .wa{display:inline-flex;align-items:center;gap:7px;font:500 9px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
      color:#0d0d0d;text-decoration:none;border:1px solid #0d0d0d;padding:9px 12px;margin-top:10px}
  .wa:hover{background:#0d0d0d;color:var(--paper)}

  .state-card{max-width:920px;margin:0 auto;background:var(--paper);padding:clamp(24px,5vw,56px);text-align:center}
  .state-card h1{font:400 clamp(22px,4vw,32px)/1.15 var(--sans);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
  .state-card p{font:300 12.5px/1.7 var(--sans);color:#514c45;margin:0 auto;max-width:46ch}
  .state-card .btn{margin-top:20px}

  @media print{
    @page{size:A4;margin:12mm}
    body{background:#fff;padding:0}
    .bar{display:none !important}
    .sheet{box-shadow:none;max-width:none}
    .head{background:#0d0d0d !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    table.items thead th,tbody tr:nth-child(even),.pay{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .wa{display:none !important}
  }
</style>
</head>
<body>

<div class="bar">
  <a class="back" href="index.html">← Tribe Culture</a>
  <div class="btns">
    <button class="btn" type="button" id="printBtn">Print</button>
    <a class="btn" id="downloadBtn" href="#" download>Download PDF</a>
    <a class="btn red" id="waBtn" href="#" target="_blank" rel="noopener">Questions on WhatsApp</a>
  </div>
</div>

<div id="host">
  <div class="state-card" id="loading"><h1>Preparing your document</h1><p>Fetching the invoice from the store…</p></div>
</div>

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const params = new URLSearchParams(location.search);
  const reference = (params.get('reference') || '').trim();
  const type = params.get('type') === 'invoice' ? 'invoice' : 'receipt';
  const token = (params.get('token') || '').trim();

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (sym, n) => sym + Number(n || 0).toLocaleString('en-NG');
  const date = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '—';
    return d.toLocaleDateString('en-NG', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' +
      d.toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' });
  };

  function fail(title, message) {
    document.querySelector('.bar').classList.remove('ready-with-doc');
    $('#host').innerHTML = `<div class="state-card">
      <h1>${esc(title)}</h1>
      <p>${esc(message)}</p>
      <a class="btn" style="border-color:#0d0d0d;color:#0d0d0d" href="track.html${reference ? '?ref=' + encodeURIComponent(reference) : ''}">Track an order</a>
      <a class="btn" style="border-color:#0d0d0d;color:#0d0d0d;margin-left:6px" href="contact.html">Contact us</a>
    </div>`;
  }

  if (!reference) { fail('No document selected', 'Open the link from your order email, or look up your order by reference.'); return; }

  fetch('/api/invoice?reference=' + encodeURIComponent(reference) + '&type=' + type + '&token=' + encodeURIComponent(token))
    .then(async (res) => {
      const json = await res.json().catch(() => ({}));
      if (!res.ok || !json.ok) throw new Error(json.error || 'This document could not be opened.');
      render(json.invoice);
    })
    .catch((err) => fail('Document unavailable', err.message || 'This link may have expired.'));

  function render(d) {
    const sym = d.currency_symbol;
    const isReceipt = d.type === 'receipt';
    const wa = d.seller.whatsapp ? 'https://wa.me/' + d.seller.whatsapp +
      '?text=' + encodeURIComponent(`Hi Tribe Culture — question about ${d.number} (order ${d.reference}).`) : '';
    if (wa) $('#waBtn').href = wa; else $('#waBtn').style.display = 'none';
    document.querySelector('.bar').classList.add('ready-with-doc');
    $('#downloadBtn').href = '/api/invoice?reference=' + encodeURIComponent(d.reference) + '&type=' + d.type +
      '&format=pdf&download=1&token=' + encodeURIComponent(token);

    document.title = `${isReceipt ? 'Receipt' : 'Invoice'} ${d.number} — Tribe Culture`;

    const items = d.items.map((i) => `
      <tr>
        <td>
          <div class="piece">
            ${i.image ? `<img src="${esc(i.image)}" alt="">` : ''}
            <div><div class="nm">${esc(i.name)}</div><div class="vr">${esc(i.variant)} · ${esc(i.sku)}</div></div>
          </div>
        </td>
        <td>${esc(i.size_label)}</td>
        <td class="num">${i.qty}</td>
        <td class="num">${money(sym, i.unit)}</td>
        <td class="amt">${money(sym, i.line_total)}</td>
      </tr>`).join('');

    $('#host').innerHTML = `
    <div class="sheet">
      <div class="doc">
        <div class="head">
          <div>
            <div class="brand">
              <img src="assets/brand/crest-bone.png" alt="Tribe Culture crest">
              <div>
                <div class="name">Tribe Culture</div>
                <div class="est">Established MMXXVI · Lagos · Worldwide${d.seller.rc ? ' · RC ' + esc(d.seller.rc) : ''}</div>
              </div>
            </div>
            <div class="contact">
              ${esc(d.seller.email)}${d.seller.phone ? ' · ' + esc(d.seller.phone) : ''}<br>
              ${esc((d.seller.site || 'tribeculture.store').replace(/^https?:\/\//, ''))}
            </div>
          </div>
          <div class="right">
            <div class="kind">${isReceipt ? 'Receipt' : 'Invoice'}</div>
            <div class="no">${esc(d.number)}</div>
            <div class="state">${esc(d.paid ? 'Paid in full' : 'Awaiting payment')}</div>
            <div class="rule"></div>
          </div>
        </div>

        <div class="body">
          <div class="meta">
            <div>
              <div class="lbl">Billed to</div>
              <div class="who">${esc(d.buyer.name)}</div>
              <div class="addr">
                ${esc(d.buyer.address)}<br>
                ${esc(d.buyer.city)}${d.buyer.country ? ', ' + esc(d.buyer.country) : ''}<br>
                ${esc(d.buyer.email)}<br>${esc(d.buyer.phone)}
              </div>
              ${d.buyer.note ? `<div class="addr" style="margin-top:8px"><strong style="font-weight:500">Note:</strong> ${esc(d.buyer.note)}</div>` : ''}
            </div>
            <div>
              <div class="lbl">Document</div>
              <div class="rows">
                <div class="row"><span>${isReceipt ? 'Receipt no.' : 'Invoice no.'}</span><span>${esc(d.number)}</span></div>
                <div class="row"><span>Order ref.</span><span>${esc(d.reference)}</span></div>
                <div class="row"><span>Issued</span><span>${date(d.issued_at)}</span></div>
                <div class="row"><span>${d.paid ? 'Payment received' : 'Payment due'}</span><span>${d.paid_at ? date(d.paid_at) : 'On receipt'}</span></div>
                <div class="row"><span>Status</span><span>${esc(d.status_label)}</span></div>
                <div class="row"><span>Dispatch</span><span>${esc(d.shipping_label || '—')}</span></div>
              </div>
            </div>
          </div>

          <table class="items">
            <thead><tr><th>Piece</th><th>Size</th><th class="r">Qty</th><th class="r">Unit</th><th class="r">Amount</th></tr></thead>
            <tbody>${items}</tbody>
          </table>

          <div class="foot">
            <div>
              <div class="pay ${d.paid ? '' : 'pending'}">
                <div class="t">${d.paid ? 'Settled' : 'How to pay'}</div>
                <p>${d.paid
                  ? `Paid with Paystack${d.paid_at ? ' on ' + date(d.paid_at) : ''}. Transaction reference ${esc(d.reference)}.`
                  : (d.bank
                      ? `Transfer to ${esc(d.bank.bank)} · ${esc(d.bank.account)} · ${esc(d.bank.name)}. Use ${esc(d.number)} as the reference.`
                      : `Pay online with card, bank transfer or USSD using order ${esc(d.reference)}.`)}</p>
              </div>
              ${wa ? `<a class="wa" href="${wa}" target="_blank" rel="noopener">WhatsApp support +${esc(d.seller.whatsapp)}</a>` : ''}
            </div>
            <div class="totals">
              <div class="trow"><span>Subtotal</span><span>${money(sym, d.subtotal)}</span></div>
              <div class="trow"><span>Delivery — ${esc(d.shipping_label || 'n/a')}</span><span>${d.shipping ? money(sym, d.shipping) : 'Free'}</span></div>
              <div class="trow big"><span>${d.paid ? 'Total paid' : 'Total due'}</span><b>${money(sym, d.total)}</b></div>
            </div>
          </div>

          <div class="notes">
            ${d.notes ? `<div><h3>Notes</h3><p>${esc(d.notes)}</p></div>` : ''}
            ${d.terms ? `<div><h3>Terms</h3><p>${esc(d.terms)}</p></div>` : ''}
          </div>

          <div class="docfoot">
            <div>
              <div class="b">${esc(d.seller.name)} — ${esc(d.seller.tagline)}</div>
              ${d.seller.rc ? `<div class="s" style="margin-top:5px">Registered with the Corporate Affairs Commission · RC ${esc(d.seller.rc)}</div>` : ''}
              <div class="s">
                ${esc(d.seller.email)}${d.seller.whatsapp ? ' · WhatsApp +' + esc(d.seller.whatsapp) : ''}<br>
                ${esc((d.seller.site || 'tribeculture.store').replace(/^https?:\/\//, ''))}
              </div>
              ${d.mode === 'preview' ? '<div class="stamp">Test document · preview mode · no payment collected</div>' : ''}
            </div>
            <div style="text-align:right">
              <div class="b">${esc(d.number)}</div>
              <div class="s">Quote this number in any correspondence.</div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }

  $('#printBtn').addEventListener('click', () => window.print());
})();
</script>
</body>
</html>
