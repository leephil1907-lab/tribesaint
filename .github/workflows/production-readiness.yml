name: Production readiness checks

on:
  push:
    branches: ["main", "production-readiness/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check invoice.js
          node --check assets/js/store.js
          node --check assets/js/pages.js
          node --check scripts/security-smoke.js
      - name: Run production security smoke checks
        run: node scripts/security-smoke.js
