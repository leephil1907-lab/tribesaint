name: Production readiness checks

on:
  push:
    branches: ["main", "production-readiness/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check && node --check scripts/security-smoke.js && node --check scripts/deploy-smoke.js
      - name: Run production security smoke checks
        run: npm run smoke
      - name: Boot the server the way Render does
        # NODE_ENV=production, an injected PORT, a temp data directory and no
        # Paystack or mail keys: a deploy must survive all of that. This is the
        # step that catches a crash-on-boot before it reaches production.
        run: npm run deploy-check
